name: Zarf Next live qualification

on:
  workflow_dispatch:
    inputs:
      production_upgrade:
        description: Deploy the signed production beta package over a released TAK installation
        type: boolean
        default: false
      next_bundle_upgrade:
        description: Deliver the signed production upgrade in a signed Next-mode bundle
        type: boolean
        default: false
      bundle_profiles:
        description: Build and verify the signed slim and Full Core bundle profiles
        type: boolean
        default: false
      live_full_core:
        description: Install the signed Full Core profile and run its runtime checks
        type: boolean
        default: false
      trial_force_conflicts:
        description: Use the local CLI patch to qualify the Core upgrade conflict
        type: boolean
        default: false
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "tests/zarf_next_live_qualification.py"
      - "tests/zarf_beta_package_qualification.py"
      - "tests/zarf_next_bundle_profiles.py"
      - "tests/fixtures/zarf-beta-contract/**"
      - ".github/workflows/zarf-next-qualification.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  next-bundle-live:
    name: Live k3d Next-mode bundle qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv, k3d, and UDS CLI
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: uv k3d aqua:defenseunicorns/uds-cli
          cache: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign versioning=semver
          cosign-release: v3.1.4

      - name: Create disposable k3d cluster
        run: |
          set -euo pipefail
          k3d cluster create next-qual --servers 1 --agents 0 --wait --timeout 180s
          uds zarf tools kubectl wait --for=condition=Ready node --all --timeout=120s
          uds zarf tools kubectl create namespace zarf
          uds zarf tools kubectl create secret generic zarf-state -n zarf \
            --from-literal=state='{"zarfAppliance":false,"distro":"k3s","architecture":"amd64","storageClass":"local-path"}'

      - name: Qualify signed Next-mode deploy, opt-out, and v1alpha1 to v1beta1 upgrade
        run: uv run --no-project --with pyyaml==6.0.3 python -B -m tests.zarf_next_live_qualification --cli uds

      - name: Delete disposable k3d cluster
        if: always()
        run: k3d cluster delete next-qual || true

  production-package:
    name: Build and verify signed production beta package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            upgrade_runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
            upgrade_runner: ubuntu-22.04-arm
    # Production upgrades use the runner profile of the regular upgrade test.
    runs-on: ${{ (inputs.production_upgrade || inputs.live_full_core) && matrix.upgrade_runner || matrix.runner }}
    timeout-minutes: ${{ inputs.live_full_core && 130 || inputs.production_upgrade && 100 || inputs.bundle_profiles && 45 || 25 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up upgrade test Python
        if: inputs.production_upgrade || inputs.live_full_core
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Free space and raise inotify limits for the upgrade
        if: inputs.production_upgrade || inputs.live_full_core
        run: |
          bash .github/scripts/trim-runner.sh
          sudo sysctl -w fs.inotify.max_user_instances=1280 fs.inotify.max_user_watches=655360
          listeners="$(sudo ss -Hltpn 'sport = :443')"
          if [[ -n "${listeners}" ]]; then
            printf '%s\n' "${listeners}"
            echo "::error title=Upgrade ingress port occupied::TCP 443 must be free for the Slim Core checkpoint."
            exit 1
          fi

      - name: Install Node, uv, Helm, k3d, and UDS CLI
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node uv helm k3d aqua:defenseunicorns/uds-cli
          cache: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign versioning=semver
          cosign-release: v3.1.4

      - name: Build the pinned UDS CLI conflict trial
        if: inputs.live_full_core && inputs.trial_force_conflicts
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d "${RUNNER_TEMP}/uds-next-cli.XXXXXX")"
          git init -q "${source_dir}"
          git -C "${source_dir}" fetch --depth 1 https://github.com/defenseunicorns/uds-cli.git 9aa9486800da005843ee13f61e151ab03b2c1d25
          git -C "${source_dir}" checkout -q --detach FETCH_HEAD
          git -C "${source_dir}" apply --unidiff-zero "${GITHUB_WORKSPACE}/tests/fixtures/uds-next-force-conflicts.patch"
          mkdir "${source_dir}/bin"
          (cd "${source_dir}" && GOTOOLCHAIN=go1.26.11 go build -mod=vendor -o bin/uds ./cmd/uds)
          CLI_FEATURES=NextMode=true "${source_dir}/bin/uds" bundle deploy --help | grep -F -- --force-conflicts
          # Released Core actions invoke zarf by name. Use the same embedded CLI.
          cat > "${source_dir}/bin/zarf" <<'EOF'
          #!/usr/bin/env bash
          exec uds zarf "$@"
          EOF
          chmod +x "${source_dir}/bin/zarf"
          PATH="${source_dir}/bin:${PATH}" zarf tools kubectl version --client
          echo "${source_dir}/bin" >> "${GITHUB_PATH}"
          echo "SIGNED_BETA_FORCE_CONFLICTS=true" >> "${GITHUB_ENV}"

      - name: Resolve the published TAK release
        if: inputs.production_upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch https://github.com/jonathanagustin/uds-takserver.git --tags
          GITHUB_REPOSITORY=jonathanagustin/uds-takserver python3 -B tests/upgrade-baseline.py \
            --output "${RUNNER_TEMP}/tak-upgrade-baseline.json"
          jq -e 'type == "object"' "${RUNNER_TEMP}/tak-upgrade-baseline.json" >/dev/null
          echo "SIGNED_BETA_UPGRADE_BASELINE=${RUNNER_TEMP}/tak-upgrade-baseline.json" >> "${GITHUB_ENV}"

      - name: Build and verify the native package
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.arch }}
          SIGNED_BETA_NEXT_BUNDLE: ${{ inputs.next_bundle_upgrade }}
          SIGNED_BETA_BUNDLE_PROFILES: ${{ inputs.bundle_profiles }}
          SIGNED_BETA_LIVE_FULL_CORE: ${{ inputs.live_full_core }}
        run: uv run --no-project --with pyyaml==6.0.3 python -B -m tests.zarf_beta_package_qualification
