name: Fork historical GEOS 680 proof

on:
  push:
    branches: [proof/historical-geos-680]

permissions:
  contents: read

concurrency:
  group: fork-historical-geos-680-proof
  cancel-in-progress: false

jobs:
  historical-geos:
    if: github.repository == 'du-jonathanagustin/uds-takserver' && github.ref == 'refs/heads/proof/historical-geos-680'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout proof source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 16
          persist-credentials: false

      - name: Run isolated native amd64 component proof
        run: |
          python3 -B -m unittest discover -s .github/geos-680-trial -p test_contract.py -v
          python3 -B .github/geos-680-trial/run.py

      - name: Retain bounded metadata receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geos-680-native-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/geos-680/evidence/*.json
          if-no-files-found: error
          retention-days: 7
